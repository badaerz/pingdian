limit_req_zone $binary_remote_addr zone=storyforge_ai:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=storyforge_asset_generate:10m rate=2r/m;
limit_req_zone $binary_remote_addr zone=storyforge_asset_status:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=storyforge_asset_download:10m rate=10r/m;

upstream story_forge_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name story-forge.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name story-forge.example.com;

    ssl_certificate /etc/letsencrypt/live/story-forge.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/story-forge.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;

    client_max_body_size 2m;
    server_tokens off;
    limit_req_status 429;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location ~ ^/api/(ai|generate)$ {
        limit_req zone=storyforge_ai burst=3 nodelay;
        proxy_pass http://story_forge_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 210s;
        proxy_send_timeout 30s;
        proxy_buffering off;
    }

    location = /api/assets/generate {
        limit_req zone=storyforge_asset_generate burst=2 nodelay;
        proxy_pass http://story_forge_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 210s;
        proxy_send_timeout 30s;
        proxy_buffering off;
    }

    location = /api/assets/status {
        limit_req zone=storyforge_asset_status burst=5 nodelay;
        proxy_pass http://story_forge_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_buffering off;
    }

    location = /api/assets/download {
        limit_req zone=storyforge_asset_download burst=3 nodelay;
        proxy_pass http://story_forge_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 210s;
        proxy_send_timeout 30s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://story_forge_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
}
